name: Construire application Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run vendor:verify
      - run: npm run audit:dependencies
      - run: npm test
      - name: Vérifier la version du tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm run build:win
        if: github.event_name == 'workflow_dispatch'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publier la version privée et ses fichiers de mise à jour
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Facture-Explorer-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
