name: Publier la version web
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/build-pages.cjs'
      - 'tests/pages-browser.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run vendor:verify
      - run: npm run audit:dependencies
      - run: npm test
      - run: node scripts/build-pages.cjs
      - name: Installer le navigateur de test
        run: |
          npm install --prefix "$RUNNER_TEMP/pages-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/pages-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Vérifier les imports et la confidentialité dans Chromium
        run: NODE_PATH="$RUNNER_TEMP/pages-tools/node_modules" node tests/pages-browser.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
