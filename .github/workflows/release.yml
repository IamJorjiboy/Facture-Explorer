name: Publier une version Windows
on:
  push:
    branches: [main]
    paths: [release-request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Vérifier la version demandée
        run: node -e "if(require('./release-request.json').version !== require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: npm run vendor:verify
      - run: npm run audit:dependencies
      - run: npm test
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Préparer les sommes de contrôle
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' }
          if ($files.Count -lt 4) { throw 'Fichiers de publication manquants' }
          $files | ForEach-Object { $h = Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Facture-Explorer-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publier les téléchargements
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Cette version est déjà publiée ; ne pas remplacer ses fichiers.' }
          } else {
            gh release create $tag --target $env:GITHUB_SHA --title "Facture Explorer $version — Windows" --notes-file docs/RELEASE-NOTES.md --draft
            if ($LASTEXITCODE -ne 0) { throw 'Création de la release impossible' }
          }
          $assets = Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -in @('latest.yml','SHA256SUMS.txt') } | ForEach-Object { $_.FullName }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Envoi des exécutables impossible' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication impossible' }
